<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nós Contra o Tempo ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f0f14;
color:white;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8));
}

h1{
font-size:3rem;
margin-bottom:10px;
}

.subtitle{
max-width:600px;
font-size:1.1rem;
opacity:.9;
}

section{
padding:50px 20px;
max-width:1000px;
margin:auto;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,.1);
}

.music-card{
background:#191922;
padding:20px;
margin-bottom:20px;
border-radius:20px;
}

audio{
width:100%;
margin-top:10px;
}

.download{
display:inline-block;
margin-top:10px;
padding:10px 18px;
background:#ff4d6d;
color:white;
text-decoration:none;
border-radius:10px;
}

footer{
text-align:center;
padding:50px;
opacity:.8;
}
</style>
</head>

<body>

<div class="hero">
<h1>❤️ Nós Contra o Tempo ❤️</h1>

<p class="subtitle">
Cada foto guarda uma memória.
Cada música guarda um sentimento.
E todas elas contam a nossa história.
</p>
</div>

<section>

<h2>📸 Nossas Memórias</h2>

<div class="gallery">
<img src="foto1.HEIC">
<img src="foto2.HEIC">
</div>

</section>

<section>

<h2>🎵 Nosso Álbum</h2>

<div class="music-card">
<h3>01 • Começo e Fim</h3>

<audio controls>
<source src="musica1.mp3" type="audio/mpeg">
</audio>

<a class="download" href="musica1.mp3" download>
⬇ Baixar Música
</a>
</div>

<div class="music-card">
<h3>02 • Parar o Tempo</h3>

<audio controls>
<source src="musica2.mp3" type="audio/mpeg">
</audio>

<a class="download" href="musica2.mp3" download>
⬇ Baixar Música
</a>
</div>

</section>

<footer>
Feito por Joaquim ❤️
</footer>

</body>
</html>
